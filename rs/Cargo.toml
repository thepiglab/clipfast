[package]
name = "clipfast-rs"
version = "0.1.0"
edition = "2021"
description = "Rust + CUDA inference runtime for BiomedCLIP (ViT-B/16 + PubMedBERT), bf16 fast / fp32 parity"
publish = false

[dependencies]
anyhow = "1"
memmap2 = "0.9"
safetensors = "0.4"
serde_json = "1"
rayon = "1"
libm = "0.2"
libc = "0.2"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
mozjpeg = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "webp", "gif"] }

tiny_http = "0.12"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py39"], optional = true }

[features]
default = []
# native Python extension (cargo build --release --features python --lib -> target/release/libclipfast_rs.so,
# install as clipfast_rs.abi3.so); see python/
python = ["dep:pyo3"]

[lib]
name = "clipfast_rs"
crate-type = ["rlib", "cdylib"]

[build-dependencies]
cc = "1"

[[bin]]
name = "clipfast-rs"
path = "src/main.rs"

[profile.release]
opt-level = 3
debug = 1
