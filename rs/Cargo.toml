[package]
name = "clipfast-rs"
version = "0.1.0"
edition = "2021"
description = "Rust + CUDA inference runtime for BiomedCLIP (ViT-B/16 + PubMedBERT), bf16 fast / fp32 parity"
publish = false

[dependencies]
anyhow = "1"
memmap2 = "0.9"
safetensors = "0.4"
serde_json = "1"

[build-dependencies]
cc = "1"

[[bin]]
name = "clipfast-rs"
path = "src/main.rs"

[profile.release]
opt-level = 3
debug = 1
